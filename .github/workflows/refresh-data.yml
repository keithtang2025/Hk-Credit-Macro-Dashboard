name: Refresh data snapshot

on:
  schedule:
    # 10:23 UTC daily = 6:23pm Hong Kong, after HKMA, C&SD and ORO afternoon releases
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch HKMA, C&SD, RVD and ORO data
        run: python scripts/refresh_snapshot.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/snapshot data/history data/debug)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshot data/history data/debug
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes"
          fi
